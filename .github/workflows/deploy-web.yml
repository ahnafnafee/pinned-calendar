name: Deploy web

# Builds the marketing site (web/) and deploys it to Cloudflare Pages.
# Auto-runs on push to main (including merges) when web/ changes; also dispatchable manually.
#
# Requires these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account ID
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # `cache:` intentionally omitted — its bundled save runs in a post-step even on
          # failure, which can poison the cache (see ci-cache-safety). The npm cache is
          # restored and saved explicitly below, with the save gated on a fully green run.

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=pinned-calendar --branch=main

      # Save only on a fully green run so a failed or partial install can never poison the
      # cache that the next deploy restores. Restore (above) is unconditional; save is gated.
      - name: Save npm cache
        if: success() && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
