name: Release

# Manual, production-release pipeline: builds a SIGNED release APK and publishes a GitHub release
# with a tag. Dispatch this from the branch you want to release (normally `main`).
#
# Requires these repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64  — base64 of the release keystore (.jks)
#   RELEASE_STORE_PASSWORD   — keystore store password
#   RELEASE_KEY_ALIAS        — key alias
#   RELEASE_KEY_PASSWORD     — key password
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: v<versionName> from app/build.gradle.kts)'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # NOTE: `cache:` intentionally omitted — see ci-cache-safety rule (bundled save runs on
          # failure too). Cache is restored/saved explicitly below, with the save gated on success().

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode signing keystore & write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing one or more signing secrets (RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD)." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Resolve version & stage APK
        id: apk
        run: |
          meta=app/build/outputs/apk/release/output-metadata.json
          version_name=$(jq -r '.elements[0].versionName' "$meta")
          version_code=$(jq -r '.elements[0].versionCode' "$meta")
          tag="${{ inputs.tag }}"
          tag="${tag:-v$version_name}"
          apk="PinnedCalendar-$version_name.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "tag=$tag"
            echo "apk=$apk"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $apk → tag $tag (versionCode $version_code)"

      - name: Verify APK signature
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs "${{ steps.apk.outputs.apk }}"

      # Save only on a fully green run so a half-built tree can never poison the cache.
      - name: Save Gradle cache
        if: success() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Pinned Calendar ${{ steps.apk.outputs.version_name }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.apk.outputs.apk }}
          fail_on_unmatched_files: true
