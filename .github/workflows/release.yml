name: Release

# Manual, production-release pipeline. Dispatch with a semver VERSION; it validates the
# version, builds a SIGNED release bundle (.aab for Play) and APK (for sideloading), and
# publishes a GitHub release with a v<version> tag. Dispatch from the branch you want to
# release (normally `main`).
#
# Google Play upload is OFF by default: it runs only when the "publish_to_play" box is
# checked at dispatch, and then uploads the .aab to the internal-testing track with the
# localized release notes from distribution/whatsnew/<version>/whatsnew-<locale>.
#
# The version input is the single source of truth:
#   - rejected if not MAJOR.MINOR.PATCH
#   - rejected if tag v<version> already exists (already released)
#   - rejected if not strictly higher than the latest v* tag
# versionCode is derived from the version (MAJOR*10000 + MINOR*100 + PATCH) so it always
# increases with the version — Play rejects a duplicate or lower code, and so do we, earlier.
#
# Requires these repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64  — base64 of the release keystore (.jks)
#   RELEASE_STORE_PASSWORD   — keystore store password
#   RELEASE_KEY_ALIAS        — key alias
#   RELEASE_KEY_PASSWORD     — key password
#
# Optional — required ONLY when the "publish_to_play" box is checked:
#   PLAY_SERVICE_ACCOUNT_JSON — Google Play service-account key (JSON) with the Android
#                               Publisher API enabled and the account granted access in the
#                               Play Console. Used to upload the .aab to the internal track.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, semver MAJOR.MINOR.PATCH (e.g. 1.4.1). Must be higher than the latest release.'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        type: boolean
        default: false
      publish_to_play:
        description: 'Upload the .aab to Google Play (internal track). Leave OFF to only cut the GitHub release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed AAB + APK & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need full history + tags for version validation and release notes

      - name: Validate version & derive versionCode
        id: ver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ver="$VERSION"
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$ver' must be MAJOR.MINOR.PATCH (e.g. 1.4.1)." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "::error::Tag v$ver already exists — version $ver is already released." >&2
            exit 1
          fi
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          if [ -n "$latest" ]; then
            top="$(printf '%s\n%s\n' "$latest" "$ver" | sort -V | tail -n1)"
            if [ "$ver" = "$latest" ] || [ "$top" != "$ver" ]; then
              echo "::error::Version $ver is not higher than the latest release (v$latest)." >&2
              exit 1
            fi
          fi
          major="${ver%%.*}"; rest="${ver#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::minor and patch must each be < 100 for the versionCode scheme." >&2
            exit 1
          fi
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          {
            echo "version_name=$ver"
            echo "version_code=$code"
            echo "tag=v$ver"
          } >> "$GITHUB_OUTPUT"
          echo "✓ Releasing v$ver (versionCode $code) — previous latest: v${latest:-none}"

      # Fail fast before the minutes-long build when release credentials are incomplete.
      - name: Preflight signing prerequisites
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing one or more signing secrets (RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD)." >&2
            exit 1
          fi

      # Play-only prerequisites stay gated so GitHub-only releases do not require Play access.
      - name: Preflight Play publish prerequisites
        if: ${{ inputs.publish_to_play }}
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          set -euo pipefail
          if [ -z "$SA_JSON" ]; then
            echo "::error::publish_to_play is checked but the PLAY_SERVICE_ACCOUNT_JSON secret is missing. Add it (see this workflow's header) or re-run with the box unchecked." >&2
            exit 1
          fi
          notes_dir="distribution/whatsnew/$VERSION_NAME"
          locales=(ar bn-BD de-DE en-US es-ES fr-FR hi-IN id it-IT ja-JP ko-KR pt-BR tr-TR vi zh-CN)
          for locale in "${locales[@]}"; do
            notes="$notes_dir/whatsnew-$locale"
            if [ ! -s "$notes" ]; then
              echo "::error::Play release notes are missing at $notes. Every supported locale needs plain text of at most 500 characters." >&2
              exit 1
            fi
            notes_chars="$(wc -m < "$notes" | tr -d '[:space:]')"
            if [ "$notes_chars" -gt 500 ]; then
              echo "::error::Play release notes at $notes are $notes_chars characters; Google Play allows at most 500." >&2
              exit 1
            fi
          done
          echo "✓ Play secret present and release notes for all ${#locales[@]} locales passed the 500-character limit."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # NOTE: `cache:` intentionally omitted — see ci-cache-safety rule (bundled save runs on
          # failure too). Cache is restored/saved explicitly below, with the save gated on success().

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode signing keystore & write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing one or more signing secrets (RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD)." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build signed release bundle (AAB) & APK
        run: >
          ./gradlew :app:bundleRelease :app:assembleRelease
          -PversionName=${{ steps.ver.outputs.version_name }}
          -PversionCode=${{ steps.ver.outputs.version_code }}
          --stacktrace --no-daemon

      - name: Stage artifacts
        id: artifacts
        run: |
          set -euo pipefail
          base="PinnedCalendar-${{ steps.ver.outputs.version_name }}"
          cp app/build/outputs/bundle/release/app-release.aab "$base.aab"
          cp app/build/outputs/apk/release/app-release.apk "$base.apk"
          {
            echo "aab=$base.aab"
            echo "apk=$base.apk"
          } >> "$GITHUB_OUTPUT"
          echo "Staged $base.aab (Play upload) and $base.apk (sideload)"

      - name: Verify APK signature
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs "${{ steps.artifacts.outputs.apk }}"

      # Play requires 16 KB page-size compatibility for apps that package native libraries.
      # This catches APK packaging regressions before the bundle reaches Play validation.
      - name: Verify 16 KB APK alignment
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/zipalign" -c -P 16 -v 4 "${{ steps.artifacts.outputs.apk }}"

      # Save only on a fully green run so a half-built tree can never poison the cache.
      - name: Save Gradle cache
        if: success() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pinned Calendar v${{ steps.ver.outputs.version_name }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            ${{ steps.artifacts.outputs.aab }}
            ${{ steps.artifacts.outputs.apk }}
          fail_on_unmatched_files: true

      # Off unless the dispatch box is checked. Runs last so the GitHub release is already
      # cut even if Play rejects the upload — you can then retry Play without rebuilding.
      - name: Upload AAB to Google Play (internal track)
        if: ${{ inputs.publish_to_play }}
        # Third-party action that receives the Play service-account key — pinned to a full
        # commit SHA (not the moving @v1 tag) so a tag repoint can't swap in code that reads
        # the secret. Bump deliberately when upgrading; SHA is v1.1.5.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.ahnafnafee.pinnedcalendar
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          # Per-version localized notes; the preflight guarantees all 15 files exist.
          whatsNewDirectory: distribution/whatsnew/${{ steps.ver.outputs.version_name }}
          tracks: internal
          status: completed
          # Promote beyond internal testers by changing `tracks` (alpha/beta/production) or
          # promoting in the Play Console. Production is intentionally never the default.
