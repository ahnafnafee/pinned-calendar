# Robolectric 4.16.x may not yet ship a sandbox for API 36; pin tests to a supported SDK.
sdk=34
# Use a stock Application in unit tests. Our real App.onCreate schedules WorkManager,
# which isn't auto-initialized in the JVM test environment (it is on-device). Tests that
# need WorkManager initialize a test instance themselves (see BootReceiverTest).
application=android.app.Application
